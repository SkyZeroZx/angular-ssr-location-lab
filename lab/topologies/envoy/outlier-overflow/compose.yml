# Envoy with outlier detection. The peers accept requests up to 64 KiB instead
# of Node's 16 KiB default, a setting apps raise for large cookies or tokens.
services:
  ssr-a:
    image: ssr-redirect-poc:full
    environment:
      PORT: "4000"
      NG_ALLOWED_HOSTS: "localhost,127.0.0.1,ssr-a,ssr-b,envoy"
      NODE_OPTIONS: "--max-http-header-size=65536"
    expose: ["4000"]

  ssr-b:
    image: ssr-redirect-poc:full
    environment:
      PORT: "4000"
      NG_ALLOWED_HOSTS: "localhost,127.0.0.1,ssr-a,ssr-b,envoy"
      NODE_OPTIONS: "--max-http-header-size=65536"
    expose: ["4000"]

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    depends_on: [ssr-a, ssr-b]
    ports: ["18293:8080"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "-l", "info"]
