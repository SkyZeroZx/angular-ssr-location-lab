# envoy/outlier-overflow with healthy_panic_threshold set to 0.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

cluster_manager:
  outlier_detection:
    event_log_path: /dev/stdout

static_resources:
  listeners:
    - name: listener_http
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "envoy status=%RESPONSE_CODE% flags=%RESPONSE_FLAGS% upstream=%UPSTREAM_HOST% req_hdr_bytes=%REQUEST_HEADERS_BYTES% resp_hdr_bytes=%RESPONSE_HEADERS_BYTES% path=%REQ(:PATH):36%\n"
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: ssr
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: ssr_cluster }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: ssr_cluster
      connect_timeout: 5s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      outlier_detection:
        # A 502 generated by Envoy itself counts as a gateway failure.
        consecutive_gateway_failure: 1
        # Defaults to 0, which counts failures but never ejects.
        enforcing_consecutive_gateway_failure: 100
        consecutive_5xx: 1
        enforcing_consecutive_5xx: 100
        interval: 1s
        base_ejection_time: 10s
        # Defaults to 10%, which is zero hosts in a two-host cluster.
        max_ejection_percent: 100
      common_lb_config:
        healthy_panic_threshold:
          value: 0
      load_assignment:
        cluster_name: ssr_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: ssr-a, port_value: 4000 }
              - endpoint:
                  address:
                    socket_address: { address: ssr-b, port_value: 4000 }
