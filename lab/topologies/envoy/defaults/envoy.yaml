# Envoy 1.31.10 at its defaults: one listener, a round-robin cluster of two
# peers, no outlier detection.
#
# The upstream header limit measured at about 80 KiB, so the 4,208 B Location
# is relayed as a 302. Outlier detection, Envoy's passive health check, is off
# unless configured, so nothing could be ejected anyway.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: listener_http
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          # flags: UPE = upstream protocol error (header
                          # rejected), UH = no healthy upstream.
                          inline_string: "envoy status=%RESPONSE_CODE% flags=%RESPONSE_FLAGS% upstream=%UPSTREAM_HOST% req_hdr_bytes=%REQUEST_HEADERS_BYTES% resp_hdr_bytes=%RESPONSE_HEADERS_BYTES% path=%REQ(:PATH):36%\n"
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: ssr
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          # No retry_policy, Envoy does not retry by default.
                          route: { cluster: ssr_cluster }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: ssr_cluster
      connect_timeout: 5s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: ssr_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: ssr-a, port_value: 4000 }
              - endpoint:
                  address:
                    socket_address: { address: ssr-b, port_value: 4000 }
