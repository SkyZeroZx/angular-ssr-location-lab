# Same config as haproxy/observe, buffer still at the 16 KB default. Only the
# payload changes (meta.json): 6,000 quotes give a Location of about 18 KB,
# which does not fit (5,000 quotes, 15,008 B, still does).
#
# HAProxy logs "Invalid http response (headers)", marks each server down on
# its first error, and answers 503 until the layer-4 check brings them back.

global
    log stdout format raw local0 info
    tune.bufsize 16384
    tune.http.logurilen 120

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend fe_http
    bind *:8080
    default_backend be_ssr

backend be_ssr
    balance roundrobin
    server app1 app1:4000 check observe layer7 error-limit 1 on-error mark-down
    server app2 app2:4000 check observe layer7 error-limit 1 on-error mark-down
