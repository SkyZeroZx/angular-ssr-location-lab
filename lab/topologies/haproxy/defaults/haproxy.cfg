# HAProxy 3.0 in front of two peers, defaults.
#
# HAProxy reads a whole response head into one buffer of tune.bufsize bytes,
# 16384 by default, so the 4,208 B Location is relayed. The line below only
# spells out the default; with 4096 HAProxy answers 502 (PH--). Above about
# 5,000 quotes the stock buffer overflows too, see
# `node scripts/escalate.mjs haproxy/defaults`.
#
# `check` is an active layer-4 probe only. Without `observe layer7` a bad
# response never marks a server down.

global
    log stdout format raw local0 info
    tune.bufsize 16384
    tune.http.logurilen 120

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend fe_http
    bind *:8080
    default_backend be_ssr

backend be_ssr
    balance roundrobin
    server app1 app1:4000 check
    server app2 app2:4000 check
