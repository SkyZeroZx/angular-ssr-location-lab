# haproxy/defaults with `observe layer7 error-limit 1 on-error mark-down`
# on both servers, HAProxy's passive health check with nginx's max_fails=1.
# It requires `check`, which is why that stays.
#
# Not affected: the 4,208 B Location fits in the default 16 KB buffer, so
# there is no layer 7 error to observe.

global
    log stdout format raw local0 info
    tune.bufsize 16384
    tune.http.logurilen 120

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend fe_http
    bind *:8080
    default_backend be_ssr

backend be_ssr
    balance roundrobin
    server app1 app1:4000 check observe layer7 error-limit 1 on-error mark-down
    server app2 app2:4000 check observe layer7 error-limit 1 on-error mark-down
