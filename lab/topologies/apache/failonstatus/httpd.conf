# apache/balancer plus failonstatus=502, Apache's opt-in passive health check.
#
# With 2,800 quotes the Location is 8,408 B. mod_proxy_http rejects it
# (AH10124) and answers 502, and the balancer counts that 502 against the
# member (AH01174), so both members go into error state. Requests keep being
# served because forcerecovery, On by default, resets the members when all of
# them are in error (AH01165).

ServerRoot "/usr/local/apache2"
ServerName apache-failonstatus
Listen 8080

LoadModule mpm_event_module          modules/mod_mpm_event.so
LoadModule unixd_module              modules/mod_unixd.so
LoadModule authz_core_module         modules/mod_authz_core.so
LoadModule log_config_module         modules/mod_log_config.so
LoadModule logio_module              modules/mod_logio.so
LoadModule slotmem_shm_module        modules/mod_slotmem_shm.so
LoadModule proxy_module              modules/mod_proxy.so
LoadModule proxy_http_module         modules/mod_proxy_http.so
LoadModule proxy_balancer_module     modules/mod_proxy_balancer.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so

User daemon
Group daemon

ErrorLog /proc/self/fd/2
LogLevel warn proxy:info proxy_http:info proxy_balancer:info
LogFormat "%{%Y-%m-%dT%H:%M:%S}t status=%>s bytes=%O worker=%{BALANCER_WORKER_NAME}e path=%U" poc
CustomLog /proc/self/fd/1 poc

ProxyRequests Off
ProxyPreserveHost On

<Proxy "balancer://ssr">
    BalancerMember "http://app1:4000"
    BalancerMember "http://app2:4000"
    # failontimeout only covers connect and read timeouts and never fires here.
    ProxySet failonstatus=502 failontimeout=On
    Require all granted
</Proxy>

ProxyPass        "/" "balancer://ssr/"
ProxyPassReverse "/" "balancer://ssr/"
