# Apache httpd 2.4 with mod_proxy_balancer over two peers, at its defaults.
services:
  app1:
    image: ssr-redirect-poc:full
    environment:
      PORT: "4000"
      NG_ALLOWED_HOSTS: "localhost,127.0.0.1,app1,app2,apache,app1:4000,app2:4000"
    expose: ["4000"]

  app2:
    image: ssr-redirect-poc:full
    environment:
      PORT: "4000"
      NG_ALLOWED_HOSTS: "localhost,127.0.0.1,app1,app2,apache,app1:4000,app2:4000"
    expose: ["4000"]

  apache:
    image: httpd:2.4
    depends_on: [app1, app2]
    ports: ["18095:8080"]
    volumes:
      - ./httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
