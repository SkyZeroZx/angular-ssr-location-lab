# Apache httpd 2.4 with mod_proxy_balancer over two peers, nothing tuned.
#
# Not affected, for two separate reasons:
#   - The upstream header limit is the member parameter responsefieldsize,
#     8192 by default (there is no LimitResponseFieldSize in 2.4). The
#     4,208 B Location fits and is relayed. Above it Apache answers 502
#     (AH10124): 2,724 quotes are relayed, 2,725 are not.
#   - Without failonstatus or failontimeout a response never puts a member in
#     error state, so even that 502 ejects nothing.

ServerRoot "/usr/local/apache2"
ServerName apache-balancer
Listen 8080

LoadModule mpm_event_module          modules/mod_mpm_event.so
LoadModule unixd_module              modules/mod_unixd.so
LoadModule authz_core_module         modules/mod_authz_core.so
LoadModule log_config_module         modules/mod_log_config.so
LoadModule logio_module              modules/mod_logio.so
LoadModule slotmem_shm_module        modules/mod_slotmem_shm.so
LoadModule proxy_module              modules/mod_proxy.so
LoadModule proxy_http_module         modules/mod_proxy_http.so
LoadModule proxy_balancer_module     modules/mod_proxy_balancer.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so

User daemon
Group daemon

# %O includes the response headers. %U is the path without the query, which
# keeps the long query out of the log.
ErrorLog /proc/self/fd/2
LogLevel warn proxy:info proxy_http:info proxy_balancer:info
LogFormat "%{%Y-%m-%dT%H:%M:%S}t status=%>s bytes=%O worker=%{BALANCER_WORKER_NAME}e path=%U" poc
CustomLog /proc/self/fd/1 poc

ProxyRequests Off
ProxyPreserveHost On

<Proxy "balancer://ssr">
    BalancerMember "http://app1:4000"
    BalancerMember "http://app2:4000"
    Require all granted
</Proxy>

ProxyPass        "/" "balancer://ssr/"
ProxyPassReverse "/" "balancer://ssr/"
