# One worker per CPU, with a shared memory zone on the upstream. The zone
# makes the peer state shared, so a peer disabled by one worker is disabled
# for all of them. Ingress controllers built on nginx write upstreams with a
# zone for the same reason.
worker_processes auto;
events { worker_connections 1024; }

http {
    log_format poc '$time_iso8601 status=$status req_len=$request_length '
                   'uaddr=$upstream_addr ustatus=$upstream_status';
    access_log /var/log/nginx/access.log poc;
    error_log  /var/log/nginx/error.log warn;

    upstream ssr {
        zone ssr 64k;
        server app-a:4000;
        server app-b:4000;
    }

    server {
        listen 8080;
        server_name _;
        location / {
            proxy_pass http://ssr;
            proxy_set_header Host $host;
        }
    }
}
