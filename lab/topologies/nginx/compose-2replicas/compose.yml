# One Compose service scaled to two replicas. nginx proxies to the service
# name and Docker DNS returns both.
services:
  ssr:
    image: ssr-redirect-poc:full
    environment:
      PORT: "4000"
      NG_ALLOWED_HOSTS: "localhost,127.0.0.1,ssr"
    expose: ["4000"]
    deploy:
      replicas: 2

  nginx:
    image: macbre/nginx-http3:1.31.2
    depends_on: [ssr]
    ports: ["18080:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
