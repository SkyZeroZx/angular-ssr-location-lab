# No upstream block, only proxy_pass to the service name. nginx resolves it
# once at startup and builds an implicit upstream from both replicas, with the
# default max_fails=1 and fail_timeout=10s. No proxy_buffer_* either, so 4k.
worker_processes 1;
events { worker_connections 1024; }

http {
    log_format poc '$time_iso8601 status=$status req_len=$request_length '
                   'uaddr=$upstream_addr ustatus=$upstream_status';
    access_log /var/log/nginx/access.log poc;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 8080;
        server_name _;
        location / {
            proxy_pass http://ssr:4000;
            proxy_set_header Host $host;
            proxy_next_upstream off;
        }
    }
}
