# nginx:alpine as a sidecar in the app's network namespace, proxying to
# http://localhost:4000. Both processes share one loopback and one /etc/hosts,
# which two services on a normal Compose network do not.
services:
  app:
    image: ssr-redirect-poc:full
    environment:
      PORT: "4000"
      NG_ALLOWED_HOSTS: "localhost,127.0.0.1,app"
    # 8080 is nginx. It is published here because a service that joins another
    # service's network namespace cannot publish ports itself.
    ports: ["18083:8080"]

  nginx:
    image: nginx:1.29.3-alpine
    depends_on: [app]
    network_mode: "service:app"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
