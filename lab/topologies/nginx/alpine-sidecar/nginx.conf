# proxy_pass to a literal "localhost" builds an implicit upstream from every
# address the resolver returns at startup. musl returns both ::1 and 127.0.0.1
# from Docker's /etc/hosts, so one Node process is counted as two peers, each
# with max_fails=1 and fail_timeout=10s. With 127.0.0.1:4000 there would be a
# single peer and no outage for other users.
#
# One worker, since without a shared zone every worker keeps its own failure
# counts.
worker_processes 1;
events { worker_connections 1024; }

http {
    log_format poc '$time_iso8601 status=$status req_len=$request_length '
                   'uaddr=$upstream_addr ustatus=$upstream_status';
    access_log /var/log/nginx/access.log poc;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 8080;
        server_name _;
        location / {
            proxy_pass http://localhost:4000;
            proxy_set_header Host $host;
            # proxy_next_upstream stays at "error timeout". invalid_header is
            # not in it, so the oversized response is not retried, but a
            # refused connection to one address still is.
        }
    }
}
