# Included by the image's own nginx.conf. With worker_processes auto and no
# zone, every worker keeps its own failure counts, so a peer is only out for
# the workers that saw its oversized responses.
upstream ssr {
    server app-a:4000;
    server app-b:4000;
}

server {
    listen 8080;
    server_name _;
    location / {
        proxy_pass http://ssr;
        proxy_set_header Host $host;
    }
}
