# nginx next to the Node server in the same container.
#
# "localhost" in proxy_pass is resolved once at startup. Docker's /etc/hosts
# maps it to 127.0.0.1 and ::1, and Node answers on both, so nginx builds an
# implicit upstream of two peers that are the same process.
worker_processes 1;
daemon off;
error_log stderr warn;
pid /tmp/nginx-poc.pid;

events { worker_connections 1024; }

http {
    log_format poc '$time_iso8601 status=$status req_len=$request_length '
                   'uaddr=$upstream_addr ustatus=$upstream_status';
    access_log /dev/stdout poc;

    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;
        location / {
            proxy_pass http://localhost:4000;
            proxy_set_header Host $host;
            proxy_next_upstream off;
        }
    }
}
