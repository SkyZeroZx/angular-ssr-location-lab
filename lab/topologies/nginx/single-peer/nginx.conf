# explicit-2peers with the second server line removed.
#
# The Location still does not fit and the oversized request still gets 502,
# but nginx ignores max_fails for a group with a single server, so the peer is
# never disabled and nobody else is affected.
worker_processes 1;
events { worker_connections 1024; }

http {
    log_format poc '$time_iso8601 status=$status req_len=$request_length '
                   'uaddr=$upstream_addr ustatus=$upstream_status';
    access_log /var/log/nginx/access.log poc;
    error_log  /var/log/nginx/error.log warn;

    upstream ssr_backend {
        server app-a:4000;
    }

    server {
        listen 8080;
        server_name _;
        location / {
            proxy_pass http://ssr_backend;
            proxy_set_header Host $host;
        }
    }
}
