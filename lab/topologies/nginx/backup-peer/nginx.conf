# A primary and a backup peer, the usual hot/standby pair. The backup is
# supposed to serve users while the primary is out. It does not help here:
# the backup is promoted when the primary is ejected and is ejected itself by
# the next oversized response.
worker_processes 1;
events { worker_connections 1024; }

http {
    # On a "no live upstreams" 502 nginx logs the group name ("ssr") instead
    # of a peer address, which tells the two kinds of 502 apart.
    log_format poc '$time_iso8601 status=$status req_len=$request_length '
                   'uaddr=$upstream_addr ustatus=$upstream_status';
    access_log /var/log/nginx/access.log poc;
    error_log  /var/log/nginx/error.log warn;

    upstream ssr {
        server app-a:4000;
        server app-b:4000 backup;
    }

    server {
        listen 8080;
        server_name _;
        location / {
            proxy_pass http://ssr;
            proxy_set_header Host $host;
            # No retry, so each 502 is charged to exactly one peer.
            proxy_next_upstream off;
        }
    }
}
