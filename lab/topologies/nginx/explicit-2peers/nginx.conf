# The usual upstream { server a; server b; } with nginx defaults:
#
#   proxy_buffer_size  4k   a Location over ~4 KB is "upstream sent too big
#                           header" and the client gets 502
#   max_fails          1    that counts as a failed attempt for the peer
#   fail_timeout       10s  so the peer is disabled for ten seconds
#
# With two peers, two such responses leave "no live upstreams" and every
# request gets 502 until fail_timeout expires. With a single peer nginx never
# disables it (see single-peer).
worker_processes 1;
events { worker_connections 1024; }

http {
    log_format poc '$time_iso8601 status=$status req_len=$request_length '
                   'uaddr=$upstream_addr ustatus=$upstream_status';
    access_log /var/log/nginx/access.log poc;
    error_log  /var/log/nginx/error.log warn;

    # One worker: without a shared zone each worker keeps its own counts.
    upstream ssr_backend {
        server app-a:4000;
        server app-b:4000;
    }

    server {
        listen 8080;
        server_name _;
        location / {
            proxy_pass http://ssr_backend;
            proxy_set_header Host $host;
        }
    }
}
