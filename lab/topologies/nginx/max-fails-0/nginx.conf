# Two peers with max_fails=0, which turns off nginx's passive health checks.
# The buffer stays at 4k, so the oversized request still gets 502, but the
# failure is never charged to the peer and other users are not affected.
worker_processes 1;
events { worker_connections 1024; }

http {
    log_format poc '$time_iso8601 status=$status req_len=$request_length '
                   'uaddr=$upstream_addr ustatus=$upstream_status';
    access_log /var/log/nginx/access.log poc;
    error_log  /var/log/nginx/error.log warn;

    upstream app_pool {
        server app-a:4000 max_fails=0;
        server app-b:4000 max_fails=0;
    }

    server {
        listen 8080;
        server_name _;
        location / {
            proxy_pass http://app_pool;
            proxy_set_header Host $host;
            proxy_next_upstream off;
        }
    }
}
