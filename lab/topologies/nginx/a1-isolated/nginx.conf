# Stock nginx with two peers. None of the defaults that matter are changed:
#
#   proxy_buffer_size  4k   the 4,208 B Location does not fit, nginx answers 502
#   max_fails          1    that one 502 marks the peer as failed
#   fail_timeout       10s  and keeps it out for ten seconds
worker_processes 1;
events { worker_connections 1024; }

http {
    log_format poc '$time_iso8601 status=$status req_len=$request_length '
                   'uaddr=$upstream_addr ustatus=$upstream_status';
    access_log /var/log/nginx/access.log poc;
    error_log  /var/log/nginx/error.log warn;

    upstream ssr {
        server app-a:4000;
        server app-b:4000;
    }

    server {
        listen 8080;
        server_name _;
        location / {
            proxy_pass http://ssr;
            proxy_set_header Host $host;
        }
    }
}
