# Two peers with proxy_buffer_size raised to 32k. max_fails stays at 1, so
# this only works by never producing a failure to count.
#
# The 4,208 B Location fits and is relayed as a 302. That is headroom, not a
# bound: nginx still accepts request lines up to 8k (414 above that), and the
# 5x returnUrl guard on the same app goes past 32k from a 7,000 B request.
# See `node scripts/escalate.mjs nginx/big-buffer --producer a2`.
worker_processes 1;
events { worker_connections 1024; }

http {
    log_format poc '$time_iso8601 status=$status req_len=$request_length '
                   'uaddr=$upstream_addr ustatus=$upstream_status';
    access_log /var/log/nginx/access.log poc;
    error_log  /var/log/nginx/error.log warn;

    upstream app_pool {
        server app-a:4000;
        server app-b:4000;
    }

    server {
        listen 8080;
        server_name _;
        location / {
            proxy_pass http://app_pool;
            proxy_set_header Host $host;
            proxy_next_upstream off;

            # proxy_buffer_size holds the status line and every header.
            # proxy_buffers and proxy_busy_buffers_size are raised only
            # because nginx requires them to be consistent with it.
            proxy_buffer_size       32k;
            proxy_buffers         8 32k;
            proxy_busy_buffers_size 64k;
        }
    }
}
