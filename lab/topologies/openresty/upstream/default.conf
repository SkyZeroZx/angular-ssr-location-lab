# Included by OpenResty's own nginx.conf (one worker, error_log at the default
# "error" level, so the warn-level "temporarily disabled" lines are not logged).
upstream ssr {
    server app-a:4000;
    server app-b:4000;
}

server {
    listen 8080;
    server_name _;
    location / {
        proxy_pass http://ssr;
        proxy_set_header Host $host;
    }
}
