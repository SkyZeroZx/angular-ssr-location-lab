# OpenResty choosing the peer from Lua, the way ingress-nginx does.
#
# The 4k buffer is kept, so the oversized request still gets 502. But with
# balancer_by_lua_block the Lua module replaces nginx's round-robin peer
# handlers, and its free handler does no failure accounting. The real peers
# are never members of the upstream group, so nothing can be disabled.
worker_processes 1;
pid /var/run/openresty/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    client_body_temp_path /var/run/openresty/nginx-client-body;
    proxy_temp_path       /var/run/openresty/nginx-proxy;
    fastcgi_temp_path     /var/run/openresty/nginx-fastcgi;
    uwsgi_temp_path       /var/run/openresty/nginx-uwsgi;
    scgi_temp_path        /var/run/openresty/nginx-scgi;

    log_format poc '$time_iso8601 status=$status req_len=$request_length '
                   'uaddr=$upstream_addr ustatus=$upstream_status';
    access_log /dev/stdout poc;

    lua_shared_dict lua_balancer 1m;

    upstream ssr_backends {
        # Placeholder, never contacted. ingress-nginx writes the same line.
        server 0.0.0.1;

        balancer_by_lua_block {
            local balancer = require "ngx.balancer"

            -- set_current_peer() takes IP literals, pinned in compose.yml.
            local endpoints = {
                { "10.191.91.11", 4000 },
                { "10.191.91.12", 4000 },
            }

            local cursor = ngx.shared.lua_balancer:incr("rr", 1, 0)
            local peer = endpoints[(cursor % #endpoints) + 1]

            -- One attempt per request, no set_more_tries().
            local ok, err = balancer.set_current_peer(peer[1], peer[2])
            if not ok then
                ngx.log(ngx.ERR, "lua balancer: set_current_peer failed: ", err)
                return ngx.exit(500)
            end
        }
    }

    server {
        listen 8080;
        server_name _;
        location / {
            proxy_pass http://ssr_backends;
            proxy_set_header Host $host;
            proxy_next_upstream off;
        }
    }
}
