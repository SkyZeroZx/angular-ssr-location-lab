# Traefik 3.1.7, static config. There is no setting for the upstream response
# header size; Traefik uses Go's net/http Transport, whose limit is 10 MB.

entryPoints:
  web:
    address: ":8080"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

api:
  dashboard: false

log:
  level: INFO

accessLog:
  format: common
